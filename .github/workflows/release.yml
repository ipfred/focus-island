name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${RELEASE_TAG}"
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## v[0-9]/p" CHANGELOG.md | sed '$d')
          if [ -z "$NOTES" ]; then
            NOTES=$(sed -n "/^## ${VERSION}$/,\$p" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'FocusIsland ${{ env.RELEASE_TAG }}'
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles dmg --target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            platform_name: 'darwin-aarch64'
          - platform: 'macos-latest'
            args: '--bundles dmg --target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            platform_name: 'darwin-x86_64'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
            platform_name: 'windows-x86_64'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
            target: ''
            platform_name: 'linux-x86_64'
          - platform: 'ubuntu-22.04-arm'
            args: '--bundles appimage,deb --target aarch64-unknown-linux-gnu'
            target: 'aarch64-unknown-linux-gnu'
            platform_name: 'linux-aarch64'

    runs-on: ${{ matrix.platform }}
    outputs:
      artifact_name: ${{ steps.upload.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev fakeroot xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        id: build
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ARTIFACT_NAME="FocusIsland"
          VERSION="${RELEASE_TAG#v}"
          UPLOADED_ARTIFACT=""

          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*-setup.exe" \) -print0 | \
          while IFS= read -r -d '' artifact; do
            dir=$(dirname "$artifact")
            base=$(basename "$artifact")

            stripped=$(echo "$base" | sed 's/^[^0-9]*//')

            if [ -z "$stripped" ]; then
              echo "WARN: could not strip prefix from $base, skipping"
              continue
            fi

            new_name="${ARTIFACT_NAME}_${stripped}"
            new_path="$dir/$new_name"
            cp "$artifact" "$new_path"

            echo "Uploading: $base → $new_name"
            gh release upload "${{ env.RELEASE_TAG }}" "$new_path" --clobber

            # 保存第一个上传的文件名用于 latest.json
            if [ -z "$UPLOADED_ARTIFACT" ]; then
              UPLOADED_ARTIFACT="$new_name"
            fi
          done

          echo "artifact_name=$UPLOADED_ARTIFACT" >> $GITHUB_OUTPUT

  generate-latest-json:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          REPO="ipfred/focus-island"

          # 获取发布日期
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 构建 latest.json
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${REPO}/releases/tag/${RELEASE_TAG} for release notes.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/FocusIsland_${VERSION}_aarch64.dmg"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/FocusIsland_${VERSION}_x64.dmg"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/FocusIsland_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "${RELEASE_TAG}" latest.json --clobber
