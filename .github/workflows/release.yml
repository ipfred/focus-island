name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${RELEASE_TAG}"
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## v[0-9]/p" CHANGELOG.md | sed '$d')
          if [ -z "$NOTES" ]; then
            NOTES=$(sed -n "/^## ${VERSION}$/,\$p" CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'FocusIsland ${{ env.RELEASE_TAG }}'
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles dmg --target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--bundles dmg --target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: ''
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
            target: ''
          - platform: 'ubuntu-22.04-arm'
            args: '--bundles appimage,deb --target aarch64-unknown-linux-gnu'
            target: 'aarch64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev fakeroot

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        id: build
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 用于 Release 文件名的 ASCII 名称（可单独维护，不影响安装后的中文名）
          ARTIFACT_NAME="FocusIsland"

          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*-setup.exe" \) -print0 | \
          while IFS= read -r -d '' artifact; do
            dir=$(dirname "$artifact")
            base=$(basename "$artifact")

            # 关键：截掉文件名中版本号之前的所有字符（中文或下划线均适用）
            # 专注岛_1.0.0_x64-setup.exe  →  1.0.0_x64-setup.exe
            # ___1.0.0_x64-setup.exe       →  1.0.0_x64-setup.exe
            stripped=$(echo "$base" | sed 's/^[^0-9]*//')

            if [ -z "$stripped" ]; then
              echo "WARN: could not strip prefix from $base, skipping"
              continue
            fi

            new_name="${ARTIFACT_NAME}_${stripped}"
            new_path="$dir/$new_name"
            cp "$artifact" "$new_path"

            echo "Uploading: $base → $new_name"
            gh release upload "${{ env.RELEASE_TAG }}" "$new_path" --clobber
          done
